<style>
:root{--teal:#067D7A;--t2:#46A5B3;--sky:#83CBEB;--coral:#EF2953;--c2:#FC7189;--cream:#F7F4EC;--ink:#0E1414;--muted:#4A5E5F;--card:rgba(255,255,255,.78);--line:rgba(6,60,60,.16)}
@media (prefers-color-scheme:dark){:root{--ink:#F7F4EC;--muted:#A9C2C4;--card:rgba(10,24,28,.78);--line:rgba(131,203,235,.22)}html{background:radial-gradient(40rem 30rem at 90% 0,rgba(239,41,83,.25),transparent 70%),radial-gradient(46rem 34rem at 0 40%,rgba(6,125,122,.4),transparent 70%),#05121A!important}}
*{box-sizing:border-box}
html{background:radial-gradient(42rem 30rem at 88% 4%,rgba(252,113,137,.3),transparent 70%),radial-gradient(46rem 34rem at 6% 30%,rgba(131,203,235,.55),transparent 70%),linear-gradient(160deg,#EAF8FB,#FBF8F1 40%,#FFEFF2);min-height:100%}
body{margin:0;color:var(--ink);font:500 1rem/1.7 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--teal);font-weight:700}
@media (prefers-color-scheme:dark){a{color:var(--sky)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:min(60rem,calc(100% - 2rem));margin:1.2rem auto 0;padding:.6rem .7rem .6rem 1rem;border:1px solid var(--line);border-radius:999px;background:var(--card);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--ink);text-decoration:none;font:800 1.15rem Syne,sans-serif}
.brand img{width:2.2rem;height:2.2rem}
.brand i{font-style:normal;color:var(--coral)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.3rem;border-radius:999px;background:linear-gradient(180deg,var(--c2),var(--coral));color:#fff!important;text-decoration:none;font-weight:800;box-shadow:0 4px 0 #9E1B3B;transition:transform .3s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--card);color:var(--ink)!important;border:1px solid var(--line);box-shadow:none}
main{width:min(46rem,calc(100% - 2rem));margin:2.4rem auto 3rem}
.card{padding:clamp(1.4rem,4vw,2.6rem);border:1px solid var(--line);border-radius:24px;background:var(--card);backdrop-filter:blur(12px);box-shadow:8px 8px 0 rgba(6,125,122,.25)}
h1{margin:0 0 .4rem;font:800 clamp(1.9rem,5vw,2.8rem)/1.1 Syne,sans-serif;letter-spacing:-.02em}
h2{margin:2rem 0 .5rem;font:800 1.2rem/1.3 Syne,sans-serif}
.upd{margin:0 0 1.4rem;font:700 .75rem 'Space Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
ul{padding-left:1.2rem} li{margin:.25rem 0}
.note{margin-top:2rem;padding:1rem 1.2rem;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:.9rem}
footer{width:min(46rem,calc(100% - 2rem));margin:0 auto 2.5rem;display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;justify-content:center;font-size:.88rem;color:var(--muted)}
footer a{color:inherit;font-weight:600}
.lost{text-align:center;display:grid;justify-items:center;gap:1rem}
.cd{position:relative;width:12rem;height:12rem;border-radius:50%;background:conic-gradient(from 0deg,#FC7189,#FFE3E8,#83CBEB,#E9FBF8,#46A5B3,#FFD3DB,#FC7189);box-shadow:0 0 0 6px #fff,0 0 0 8px var(--line),10px 10px 0 rgba(239,41,83,.35);animation:skip 2.4s steps(1) infinite}
.cd::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--cream);box-shadow:0 0 0 6px rgba(255,255,255,.7)}
.cd::before{content:"";position:absolute;left:12%;top:30%;width:76%;height:4px;background:rgba(14,20,20,.55);transform:rotate(-18deg);border-radius:4px}
@keyframes skip{0%{transform:rotate(0)}20%{transform:rotate(70deg)}22%{transform:rotate(64deg)}45%{transform:rotate(150deg)}47%{transform:rotate(142deg)}70%{transform:rotate(250deg)}72%{transform:rotate(244deg)}100%{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cd{animation:none}}
.big{font:800 clamp(4.5rem,18vw,8rem)/.9 Syne,sans-serif;letter-spacing:-.04em;background:linear-gradient(180deg,var(--c2),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(4px 4px 0 var(--sky))}
.row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.6rem}
